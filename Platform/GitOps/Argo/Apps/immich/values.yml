---
controllers:
  main:
    containers:
      main:
        image:
          # Pinned explicitly so a future chart bump can't silently walk
          # the app version forward underneath us. Matches the chart tag
          # in application.yml (immich-0.13.1) — re-verify this pairing
          # any time that tag changes.
          tag: v3.0.0
        env:
          # Dedicated Postgres from manifests/postgres.yaml — not the
          # shared data_01 instance. See HELM-DEPLOYMENT-GUIDE.md Q1 for
          # why (VectorChord extension requirement).
          DB_HOSTNAME: immich-postgresql-rw
          DB_USERNAME: immich
          DB_DATABASE_NAME: immich
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-postgres-user
                key: password
                # REDIS_HOSTNAME isn't set here — it defaults to
                # '{{ printf "%s-valkey" .Release.Name }}', which only
                # resolves correctly because this Application's name (and
                # therefore the Helm release name) is "immich". Renaming
                # the Application would silently break this.

immich:
  persistence:
    library:
      # Must already exist — this chart does not create it. Defined in
      # manifests/postgres.yaml alongside the Postgres PVC.
      existingClaim: immich-library

# Job queue cache — chart-bundled, not the shared data_01 Redis. Disposable
# by design (chart itself defaults its persistence to emptyDir).
valkey:
  enabled: true

server:
  enabled: true
  ingress:
    main:
      enabled: true
      className: traefik
      # No nginx-ingress annotations here — the chart's own example values
      # include nginx.ingress.kubernetes.io/proxy-body-size, which does
      # nothing under Traefik. See HELM-DEPLOYMENT-GUIDE.md Q5.
      annotations: {}
      hosts:
        - host: immich.platform.local
          paths:
            - path: "/"
              service:
                identifier: main
      tls: []

machine-learning:
  enabled: true
