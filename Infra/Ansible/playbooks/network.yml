---
- name: Core Networking Infrastructure
  hosts: network
  become: true
  pre_tasks:
    - name: Create tailscaled override directory
      ansible.builtin.file:
        path: /etc/systemd/system/tailscaled.service.d
        state: directory
        mode: "0755"
      become: true
      when: is_lxc | default(false) | bool

    - name: Configure tailscaled for LXC userspace networking
      ansible.builtin.copy:
        dest: /etc/systemd/system/tailscaled.service.d/override.conf
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/sbin/tailscaled --tun=userspace-networking --state=/var/lib/tailscale/tailscaled.state --socket=/run/tailscale/tailscaled.sock
        mode: "0644"
      become: true
      when: is_lxc | default(false) | bool

    - name: Create tailscaled override directory
      ansible.builtin.file:
        path: /etc/systemd/system/tailscaled.service.d
        state: directory
        mode: "0755"
      become: true
      when: is_lxc | default(false) | bool

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true
      become: true
      when: is_lxc | default(false) | bool

    - name: Disable systemd-resolved DNS stub listener
      ansible.builtin.lineinfile:
        path: /etc/systemd/resolved.conf
        regexp: '^#?DNSStubListener='
        line: 'DNSStubListener=no'

    - name: Restart systemd-resolved to free port 53
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted
      become: true

  roles:
    - role: docker
    - role: tailscale
    - role: adguardhome
    - role: traefik

  post_tasks:
    - name: Create Traefik conf.d directory
      ansible.builtin.file:
        path: /etc/traefik/conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: true

    - name: Create Traefik certs directory
      ansible.builtin.file:
        path: /etc/traefik/certs
        state: directory
        owner: root
        group: root
        mode: "0750"
      become: true

    - name: Copy TLS certificate
      ansible.builtin.copy:
        src: "{{ lookup('env', 'HOME') }}/lab-certs/_wildcard.platform.local+1.pem"
        dest: /etc/traefik/certs/platform.local.crt
        owner: root
        group: root
        mode: "0644"
      become: true
      notify: Restart traefik container

    - name: Copy TLS private key
      ansible.builtin.copy:
        src: "{{ lookup('env', 'HOME') }}/lab-certs/_wildcard.platform.local+1-key.pem"
        dest: /etc/traefik/certs/platform.local.key
        owner: root
        group: root
        mode: "0600"
      become: true
      notify: Restart traefik container

    - name: Deploy Traefik TLS store config
      ansible.builtin.copy:
        dest: /etc/traefik/conf.d/tls.yml
        owner: root
        group: root
        mode: "0644"
        content: |
          tls:
            certificates:
              - certFile: /etc/traefik/certs/platform.local.crt
                keyFile: /etc/traefik/certs/platform.local.key
            stores:
              default:
                defaultCertificate:
                  certFile: /etc/traefik/certs/platform.local.crt
                  keyFile: /etc/traefik/certs/platform.local.key
      become: true
      notify: Restart traefik container

    - name: Deploy Traefik service routes
      ansible.builtin.copy:
        dest: "/etc/traefik/conf.d/{{ item.name }}.yml"
        owner: root
        group: root
        mode: "0644"
        content: "{{ item.config | to_nice_yaml }}"
      become: true
      loop:
        - name: authentik
          config:
            http:
              routers:
                authentik:
                  rule: "Host(`authentik.platform.local`)"
                  service: authentik
                  entryPoints:
                    - web_https
                  tls: {}
              services:
                authentik:
                  loadBalancer:
                    servers:
                      - url: "http://192.168.0.212:9000"

        - name: vaultwarden
          config:
            http:
              routers:
                vaultwarden:
                  rule: "Host(`vaultwarden.platform.local`)"
                  service: vaultwarden
                  entryPoints:
                    - web_https
                  tls: {}
              services:
                vaultwarden:
                  loadBalancer:
                    servers:
                      - url: "http://192.168.0.212:8080"

        - name: watchdog
          config:
            http:
              routers:
                watchdog:
                  rule: "Host(`watchdog.platform.local`)"
                  service: watchdog
                  entryPoints:
                    - web_https
                  tls: {}
              services:
                watchdog:
                  loadBalancer:
                    servers:
                      - url: "http://192.168.0.212:3001"

        - name: argocd
          config:
            http:
              routers:
                argocd:
                  rule: "Host(`argocd.platform.local`)"
                  service: argocd
                  entryPoints:
                    - web_https
                  tls: {}
              services:
                argocd:
                  loadBalancer:
                    servers:
                      - url: "http://192.168.0.217:80"

        - name: minio
          config:
            http:
              routers:
                minio:
                  rule: "Host(`minio.platform.local`)"
                  service: minio
                  entryPoints:
                    - web_https
                  tls: {}
              services:
                minio:
                  loadBalancer:
                    servers:
                      - url: "http://192.168.0.213:9003"

        - name: immich
          config:
            http:
              routers:
                immich:
                  rule: "Host(`immich.platform.local`)"
                  service: immich
                  entryPoints:
                    - web_https
                  tls: {}
              services:
                immich:
                  loadBalancer:
                    servers:
                      - url: "http://192.168.0.215:80"
      notify: Restart traefik container

  handlers:
    - name: Restart traefik container
      community.docker.docker_container:
        name: "{{ traefik_container_name }}"
        state: started
        restart: true
      become: true
